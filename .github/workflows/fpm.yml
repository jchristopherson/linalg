name: fpm

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / shared=${{ matrix.shared }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '14'
            shared: true
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: false
          - os: ubuntu-latest
            compiler: gcc
            version: '15'
            shared: true
          - os: ubuntu-latest
            compiler: intel
            version: '2023.2'
            shared: true
          - os: windows-latest
            compiler: gcc
            version: '15'
            shared: false
          - os: windows-latest
            compiler: gcc
            version: '15'
            shared: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 libraries (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-openblas
            mingw-w64-x86_64-arpack

      - name: Add MinGW64 toolchain to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"

      - name: Set up Fortran toolchain
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Provide BLAS/LAPACK/ARPACK linker aliases (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          LIB_DIR="$MSYS2_LOCATION/mingw64/lib"
          OPENBLAS_LIB=""
          ARPACK_LIB=""
          for CANDIDATE in "$LIB_DIR/libopenblas.dll.a" "$LIB_DIR/libopenblas.a"; do
            if [[ -f "$CANDIDATE" ]]; then
              OPENBLAS_LIB="$CANDIDATE"
              break
            fi
          done

          if [[ -z "$OPENBLAS_LIB" ]]; then
            echo "Unable to locate OpenBLAS library in $LIB_DIR"
            ls -la "$LIB_DIR"/libopenblas* || true
            exit 1
          fi

          for CANDIDATE in "$LIB_DIR/libarpack.dll.a" "$LIB_DIR/libarpack.a"; do
            if [[ -f "$CANDIDATE" ]]; then
              ARPACK_LIB="$CANDIDATE"
              break
            fi
          done

          if [[ -z "$ARPACK_LIB" ]]; then
            echo "Unable to locate ARPACK library in $LIB_DIR"
            ls -la "$LIB_DIR"/libarpack* || true
            exit 1
          fi

          ALIAS_DIR="$RUNNER_TEMP/blas-lapack-arpack-alias"
          mkdir -p "$ALIAS_DIR"
          cp "$OPENBLAS_LIB" "$ALIAS_DIR/libblas.a"
          cp "$OPENBLAS_LIB" "$ALIAS_DIR/liblapack.a"
          cp "$ARPACK_LIB" "$ALIAS_DIR/libarpack.a"
          echo "LIBRARY_PATH=$ALIAS_DIR${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Show compiler version
        shell: bash
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}
        run: |
          "$FC" --version

      - name: Install BLAS/LAPACK/ARPACK (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev libarpack2-dev

      - name: Install fpm
        uses: fortran-lang/setup-fpm@v5
        with:
          fpm-version: 'v0.10.1'

      - name: Build LINALG
        shell: bash
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}
          FPM_FC: ${{ steps.setup-fortran.outputs.fc }}
          FPM_CC: ${{ steps.setup-fortran.outputs.cc }}
          SHARED: ${{ matrix.shared }}
        run: |
          FLAGS=""
          if [[ "$SHARED" == "true" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              FLAGS="--flag=-Wl,--export-all-symbols"
            else
              FLAGS="--flag=-fPIC"
            fi
          fi
          if [[ -n "$FLAGS" ]]; then
            fpm build $FLAGS
          else
            fpm build
          fi

      - name: Run tests
        shell: bash
        env:
          FC: ${{ steps.setup-fortran.outputs.fc }}
          CC: ${{ steps.setup-fortran.outputs.cc }}
          FPM_FC: ${{ steps.setup-fortran.outputs.fc }}
          FPM_CC: ${{ steps.setup-fortran.outputs.cc }}
          SHARED: ${{ matrix.shared }}
        run: |
          FLAGS=""
          if [[ "$SHARED" == "true" ]]; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              FLAGS="--flag=-Wl,--export-all-symbols"
            else
              FLAGS="--flag=-fPIC"
            fi
          fi
          if [[ -n "$FLAGS" ]]; then
            fpm test $FLAGS
          else
            fpm test
          fi